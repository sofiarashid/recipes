<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Sofia's recipe collection — simple, soft, and made to be shared.">

    <title>Sofia's Kitchen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header class="site-header">

        <a class="brand" href="index.html">
            <span>❤︎ Sofia's</span> Kitchen
        </a>

        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a href="#categories">
                Recipes
            </a>

        </nav>

        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
            ◐
        </button>

        <button class="menu-button" aria-label="Open menu" aria-expanded="false">
            ☰
        </button>

    </header>


    <main>

        <section class="hero">

            <div>

                <p class="eyebrow">
                    A little collection of things worth making
                </p>

                <h1>
                    Recipes by Sofia
                </h1>

                <a class="button" href="#categories">
                    Browse recipes
                </a>

            </div>

            <div class="hero-flower" aria-hidden="true">
                ✿
            </div>

        </section>


        <section class="search-wrap" aria-label="Search recipes">

            <label for="search">
                Search recipes
            </label>

            <input id="search" type="search" placeholder="Try “cookies”, “cake”, “savory”..." autocomplete="off">

            <div id="search-results" class="search-results"></div>

        </section>


        <section id="categories" class="categories-section">

            <div class="section-heading">

                <p class="eyebrow">
                    The recipe box
                </p>

                <h2>
                    Browse by category
                </h2>

            </div>

            <div id="category-grid" class="category-grid"></div>

        </section>

    </main>


    <footer>

        <p>
            © <span id="year"></span> Sofia's Kitchen
        </p>

    </footer>


    <script src="recipes.js"></script>
    <script src="app.js"></script>

</body>

</html>
